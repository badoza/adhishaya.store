backend:
name: github
repo: badoza/adhishaya.store
branch: main

media_folder: "images"
public_folder: "images"

collections:

name: "store_database"
label: "Store Database"
files:

label: "Product Inventory"
name: "products"
file: "data/products.json"
fields:

name: "items"
label: "All Products"
widget: "list"
fields:

name: "id"
label: "Unique Product ID (e.g., prod_1)"
widget: "string"

name: "name"
label: "Product Name"
widget: "string"

name: "category"
label: "Category"
widget: "select"
options:

"Men's Health"

"Women's Health"

"Digestive Health"

"Blood Booster"

"Skin care"

"Hair care"

"Immunity Care"

"Daily Essentials"

name: "desc"
label: "Short Description"
widget: "text"

name: "price"
label: "Selling Price (Rs)"
widget: "number"

name: "mrp"
label: "MRP Original Price (Rs)"
widget: "number"

name: "rating"
label: "Star Rating (e.g., 4.8)"
widget: "number"
value_type: "float"
default: 5.0

name: "reviews"
label: "Total Reviews (e.g., 150)"
widget: "number"
default: 0

name: "isHero"
label: "Set as Hero Product (Shows on Home Banner)?"
widget: "boolean"
default: false
required: false

name: "image"
label: "Main Cover Image"
widget: "image"

name: "gallery"
label: "Extra Gallery Images (For the slider)"
widget: "list"
required: false
field:
name: "img"
label: "Image"
widget: "image"

name: "tamil_content"
label: "Tamil / Deep Details Content"
widget: "markdown"
required: false
